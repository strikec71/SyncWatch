name: Verify SyncWatch
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm run package
        working-directory: extension
      - uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: extension/dist/packages/*.zip
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run verify
        working-directory: server

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      # The hosted runner already provides Chrome's system libraries. Avoid an
      # unrelated apt upgrade before downloading the pinned Playwright browser.
      - run: npx playwright install chromium
        working-directory: extension
      - run: npm run test:browser
        working-directory: extension
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-fullscreen-results
          path: |
            docs/audit/fullscreen-results.json
            docs/audit/fullscreen-*.png
