name = "syncwatch-signal"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Durable Object с SQLite-бэкендом доступен на БЕСПЛАТНОМ тарифе Workers.
# Room хранит состояние в памяти; storage используется для служебного alarm.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Presence «друзья онлайн»: HTTP JSON-хаб, отдельный DO. Storage используем (SQLite-KV):
# записи presence/inbox/invite с очисткой по TTL и независимым alarm.
[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "Presence"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Presence"]
